name: Patch PDF mobile FASTE
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make PDF action mobile friendly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('faste-devis.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'function downloadCurrentPdf\(\)\{.*?\n\}'
          replacement='''function downloadCurrentPdf(){
            try{
              const d=currentFormDoc();
              const pdf=buildPdf(d);
              const blob=pdf.output('blob');
              const url=URL.createObjectURL(blob);
              const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
              if(isIOS){
                const win=window.open(url,'_blank');
                if(!win){
                  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.click();
                }
                setTimeout(()=>URL.revokeObjectURL(url),60000);
              }else{
                const a=document.createElement('a');a.href=url;a.download=(d.number||'FASTE-document')+'.pdf';document.body.appendChild(a);a.click();a.remove();
                setTimeout(()=>URL.revokeObjectURL(url),1000);
              }
            }catch(e){console.error(e);alert('Impossible de générer le PDF. Réessaie.');}
          }'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('downloadCurrentPdf not found')
          p.write_text(s2,encoding='utf-8')
          print('PDF mobile patch applied')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faste-devis.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Rend le bouton PDF compatible mobile"
          git push
