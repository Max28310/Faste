name: Diagnostic PDF
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '--- pdf.save ---'
          grep -oE '.{0,120}pdf\.save.{0,120}' faste-devis.html || true
          echo '--- downloadCurrentPdf ---'
          grep -oE '.{0,80}downloadCurrentPdf.{0,500}' faste-devis.html || true
          echo '--- generatePdfForMobile ---'
          grep -oE '.{0,80}generatePdfForMobile.{0,700}' faste-devis.html || true
      - if: always()
        run: |
          rm -f .github/workflows/diag-pdf.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/diag-pdf.yml
          git diff --cached --quiet || git commit -m "Supprime diagnostic PDF"
          git push || true
