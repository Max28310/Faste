name: Fix PDF header
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix undefined header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('faste-devis.html')
          s=p.read_text(encoding='utf-8')
          old='function nextPage(){footer();pdf.addPage();header();return 52}'
          new='function nextPage(){footer();pdf.addPage();drawPdfHeader(pdf,d);return 52}'
          if old not in s:
              raise SystemExit('Bloc header introuvable')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('PDF HEADER FIX OK')
          PY
      - name: Verify and commit
        run: |
          grep -F "function nextPage(){footer();pdf.addPage();drawPdfHeader(pdf,d);return 52}" faste-devis.html
          rm -f .github/workflows/fix-pdf-header.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faste-devis.html .github/workflows/fix-pdf-header.yml
          git commit -m "Corrige erreur header du PDF"
          git push
