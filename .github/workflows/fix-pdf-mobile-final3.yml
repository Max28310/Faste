name: Fix PDF mobile final 3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final mobile PDF fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('faste-devis.html')
          s=p.read_text(encoding='utf-8')
          # Capture the PDF before jsPDF's save() is called when mobile capture is active.
          old='pdf.save(filename);'
          new="if(window.__fasteCapturePdf){window.__fastePdfBlob=pdf.output('blob');return pdf;}pdf.save(filename);return pdf;"
          if new not in s:
              if old not in s: raise SystemExit('pdf.save(filename) introuvable')
              s=s.replace(old,new,1)
          # Replace only downloadCurrentPdf; this is the button's actual entry point.
          start=s.find('async function downloadCurrentPdf(')
          if start<0: raise SystemExit('downloadCurrentPdf introuvable')
          depth=0;began=False;end=None
          for i in range(start,len(s)):
              c=s[i]
              if c=='{': depth+=1;began=True
              elif c=='}' and began:
                  depth-=1
                  if depth==0: end=i+1;break
          if end is None: raise SystemExit('fin downloadCurrentPdf introuvable')
          fn="""async function downloadCurrentPdf(){
            try{
              const d=currentFormDoc();
              const filename=(d.number||'FASTE-document')+'.pdf';
              const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
              if(!isIOS){generatePdf(d);return;}
              if(!window.jspdf?.jsPDF){alert('Le module PDF n’est pas chargé. Vérifie ta connexion internet puis recharge la page.');return;}
              window.__fasteCapturePdf=true;
              window.__fastePdfBlob=null;
              try{generatePdf(d);}finally{window.__fasteCapturePdf=false;}
              const blob=window.__fastePdfBlob;
              window.__fastePdfBlob=null;
              if(!blob)throw new Error('PDF non généré');
              const file=new File([blob],filename,{type:'application/pdf'});
              if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return;}
              const url=URL.createObjectURL(blob);
              const win=window.open(url,'_blank');
              if(!win)window.location.href=url;
              setTimeout(()=>URL.revokeObjectURL(url),60000);
            }catch(e){console.error(e);alert('Impossible de générer le PDF : '+(e?.message||e));}
          }"""
          s=s[:start]+fn+s[end:]
          p.write_text(s,encoding='utf-8')
          assert 'window.__fasteCapturePdf' in s
          assert "window.__fastePdfBlob=pdf.output('blob')" in s
          assert 'async function downloadCurrentPdf' in s
          print('PATCH VERIFIED')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faste-devis.html
          git commit -m "Corrige définitivement le PDF iPhone"
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-pdf-mobile-final3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/fix-pdf-mobile-final3.yml
          git diff --cached --quiet || git commit -m "Supprime le workflow temporaire PDF"
          git push || true
