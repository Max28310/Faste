name: Patch PDF layout FASTE
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-pdf-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorganize PDF layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('faste-devis.html')
          s=p.read_text(encoding='utf-8')

          # 1) Remplace le footer PDF par un pied de page professionnel,
          #    avec les mentions légales discrètes sur chaque page.
          footer_new="""function footer(){
            const cs={companyName:'FASTE',legalForm:'',siren:'',siret:'',vat:'',capital:'',address:'',zip:'',city:'',phone:'',email:'',website:'',iban:'',bic:'',...companySettings};
            const page=pdf.internal.getNumberOfPages();
            const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();
            const left=14,right=W-14;
            pdf.setDrawColor(225,229,236);pdf.setLineWidth(.25);pdf.line(left,H-19,right,H-19);
            const legal=[
              [cs.companyName,cs.legalForm].filter(Boolean).join(' '),
              [cs.address,[cs.zip,cs.city].filter(Boolean).join(' ')].filter(Boolean).join(' — '),
              [cs.siret&&('SIRET '+cs.siret),cs.siren&&('SIREN '+cs.siren),cs.vat&&('TVA '+cs.vat),cs.capital&&('Capital '+cs.capital+' €')].filter(Boolean).join('  •  '),
              [cs.phone,cs.email].filter(Boolean).join('  •  ')
            ].filter(Boolean);
            let fy=H-14;
            if(legal.length) pdfT(legal.join('  •  '),left,fy,5.8,'normal',[105,115,130],{maxWidth:W-42});
            pdfT('Page '+page,right,H-10,6,'normal',[105,115,130],{align:'right'});
          }"""
          s2,n=re.subn(r'function footer\(\)\{.*?\}\s*function nextPage', footer_new+'\nfunction nextPage', s, count=1, flags=re.S)
          if n:
              s=s2
          else:
              raise SystemExit('function footer not found')

          # 2) Allège le bloc ÉMETTEUR : les informations légales ne sont plus
          #    entassées en haut du devis. Elles restent dans le footer.
          block_new="""header();y=54;const cardW=87,gap=6,clientX=left+cardW+gap;fillRound(left,y,cardW,43,3,soft);strokeRound(left,y,cardW,43,3,line);fillRound(clientX,y,cardW,43,3,soft);strokeRound(clientX,y,cardW,43,3,line);const cs={companyName:'FASTE',legalForm:'',siren:'',siret:'',vat:'',capital:'',address:'',zip:'',city:'',phone:'',email:'',website:'',iban:'',bic:'',...companySettings};pdfT('ÉMETTEUR',left+7,y+8,7.5,'bold',muted);pdfT(cs.companyName||'FASTE',left+7,y+17,11,'bold',text);let iy=y+24;if(cs.legalForm)iy=wrapped(cs.legalForm,left+7,iy,73,7,3.7,'normal',text);if(cs.address)iy=wrapped(cs.address,left+7,iy,73,7,3.7,'normal',text);if(cs.zip||cs.city)iy=wrapped([cs.zip,cs.city].filter(Boolean).join(' '),left+7,iy,73,7,3.7,'normal',text);if(cs.phone||cs.email)iy=wrapped([cs.phone,cs.email].filter(Boolean).join('  •  '),left+7,iy,73,7,3.7,'normal',text);pdfT('CLIENT',clientX+7,y+8,7.5,'bold',muted);const clientNameLines=pdf.splitTextToSize(d.client||'Client à renseigner',73);pdfT(clientNameLines,clientX+7,y+17,10,'bold',text);let cy=y+17+clientNameLines.length*4.5;const prospect=d.prospectId?prospects.find(p=>p.id===d.prospectId):null;const cAddress=d.clientAddress||prospect?.address||'';const cZipCity=d.clientZipCity||[prospect?.zip,prospect?.city].filter(Boolean).join(' ');if(cAddress)cy=wrapped(cAddress,clientX+7,cy,73,7.4,3.8,'normal',text);if(cZipCity)cy=wrapped(cZipCity,clientX+7,cy,73,7.4,3.8,'normal',text);if(d.contact)cy=wrapped(d.contact,clientX+7,cy,73,7.2,3.8,'normal',muted);if(d.venue)cy=wrapped('Lieu : '+d.venue,clientX+7,cy+1,73,7.2,3.8,'normal',muted);y+=52;"""
          pattern=r'header\(\);y=54;const cardW=87,gap=6,clientX=left\+cardW\+gap;.*?y\+=57;'
          s2,n=re.subn(pattern, block_new, s, count=1, flags=re.S)
          if n:
              s=s2
          else:
              # Le patch reste idempotent : si le bloc est déjà à jour, on ne bloque pas.
              print('Bloc PDF haut déjà modifié ou introuvable ; footer appliqué.')

          p.write_text(s,encoding='utf-8')
          print('Mise en page PDF FASTE mise à jour.')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faste-devis.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Déplace les mentions légales du PDF en pied de page"
          git push
