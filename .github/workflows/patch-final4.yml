name: FASTE settings integration final 4

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and verify
        shell: python
        run: |
          from pathlib import Path
          import re

          changed=[]

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'faste-parametres.html' not in s:
              marker='        <button class="nav-btn" data-page="donnees">⚙ Données</button>'
              if s.count(marker)!=1: raise SystemExit(f'INDEX MARKER COUNT={s.count(marker)}')
              s=s.replace(marker,marker+'\n        <button class="nav-btn" type="button" onclick="window.location.href=\'faste-parametres.html\'">⚙️ Paramètres</button>',1)
              p.write_text(s,encoding='utf-8'); changed.append('index.html')

          p=Path('faste-devis.html'); s=p.read_text(encoding='utf-8')
          if 'faste-parametres.html' not in s:
              old='<div class="actions"><button class="btn secondary" onclick="window.close()">← Fermer</button><button class="btn green" onclick="openDoc()">+ Nouveau devis</button></div>'
              if s.count(old)!=1: raise SystemExit(f'DEVIS TOP MARKER COUNT={s.count(old)}')
              s=s.replace(old,'<div class="actions"><button class="btn secondary" onclick="window.location.href=\'index.html\'">← FASTE</button><button class="btn secondary" onclick="window.location.href=\'faste-parametres.html\'">⚙️ Paramètres</button><button class="btn green" onclick="openDoc()">+ Nouveau devis</button></div>',1)
          if 'let companySettings=' not in s:
              old='let docs=[];let prospects=[];let currentId=null;let cloudData={};'
              if s.count(old)!=1: raise SystemExit(f'DEVIS STATE MARKER COUNT={s.count(old)}')
              s=s.replace(old,'let docs=[];let prospects=[];let currentId=null;let cloudData={};let companySettings={};',1)
          if 'companySettings=cloudData.settings||{};' not in s:
              old='cloudData=a?.[0]?.data||{};docs=Array.isArray(cloudData.devis_factures)?cloudData.devis_factures:[];prospects=mergeProspects(cloudData.prospects);'
              if s.count(old)!=1: raise SystemExit(f'DEVIS CLOUD MARKER COUNT={s.count(old)}')
              s=s.replace(old,'cloudData=a?.[0]?.data||{};companySettings=cloudData.settings||{};docs=Array.isArray(cloudData.devis_factures)?cloudData.devis_factures:[];prospects=mergeProspects(cloudData.prospects);',1)

          if "const cs={companyName:'FASTE'" not in s:
              pattern=r"pdfT\('ÉMETTEUR',left\+7,y\+8,7\.5,'bold',muted\);.*?pdfT\('CLIENT',clientX\+7,y\+8,7\.5,'bold',muted\);"
              replacement="const cs={companyName:'FASTE',legalForm:'',siren:'',siret:'',vat:'',capital:'',address:'',zip:'',city:'',phone:'',email:'',website:'',iban:'',bic:'',...companySettings};pdfT('ÉMETTEUR',left+7,y+8,7.5,'bold',muted);pdfT(cs.companyName||'FASTE',left+7,y+17,11,'bold',text);let issuer=[];if(cs.legalForm)issuer.push(cs.legalForm);if(cs.siret)issuer.push('SIRET '+cs.siret);if(cs.siren)issuer.push('SIREN '+cs.siren);if(cs.vat)issuer.push('TVA '+cs.vat);if(cs.capital)issuer.push('Capital '+cs.capital+' €');if(cs.address)issuer.push(cs.address+(cs.zip||cs.city?' — '+[cs.zip,cs.city].filter(Boolean).join(' '):''));if(cs.phone)issuer.push(cs.phone);if(cs.email)issuer.push(cs.email);wrapped(issuer.join('  •  ')||'Informations légales à compléter',left+7,y+24,73,6.8,3.7,'normal',issuer.length?text:muted);pdfT('CLIENT',clientX+7,y+8,7.5,'bold',muted);"
              s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'PDF ISSUER REGEX MATCH={n}')

          if "cs.iban?'IBAN : '+cs.iban" not in s:
              old="pdfT('Les informations légales de FASTE pourront être ajoutées ultérieurement dans les paramètres de l’entreprise.',left,y,7.2,'normal',muted);pdfT('Document généré automatiquement par FASTE.',left,y+4.5,7.2,'normal',muted);"
              if s.count(old)!=1: raise SystemExit(f'PDF FOOTER MARKER COUNT={s.count(old)}')
              s=s.replace(old,"pdfT((cs.companyName||'FASTE')+'  •  Document commercial',left,y,7.2,'normal',muted);pdfT(cs.iban?'IBAN : '+cs.iban+(cs.bic?'  •  BIC : '+cs.bic:''):'Coordonnées de paiement disponibles dans les paramètres.',left,y+4.5,7.2,'normal',muted);",1)

          p.write_text(s,encoding='utf-8')
          if 'faste-parametres.html' in s and 'companySettings=' in s and "const cs={companyName:'FASTE'" in s: changed.append('faste-devis.html')
          print('CHANGED:',changed)
      - name: Commit if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html faste-devis.html
          git status --short
          if git diff --cached --quiet; then echo 'NO PATCH NEEDED'; exit 0; fi
          git commit -m 'Integrate shared company settings'
          git push
