name: Fix PDF header final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix remaining header calls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('faste-devis.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace('}header();y=54;', '}drawPdfHeader(pdf,d);y=54;')
          s=s.replace('function nextPage(){footer();pdf.addPage();header();return 52}', 'function nextPage(){footer();pdf.addPage();drawPdfHeader(pdf,d);return 52}')
          if s==old:
            raise SystemExit('No remaining target found')
          p.write_text(s,encoding='utf-8')
          PY
          if grep -o 'header();' faste-devis.html; then
            echo 'ERROR: header() still present'
            exit 1
          fi
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add faste-devis.html
          git commit -m 'Fix PDF header call on iPhone'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-pdf-header-final.yml
          git commit -m 'Remove temporary PDF fix workflow'
          git push
