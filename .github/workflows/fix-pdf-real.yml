name: Fix PDF real
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch real PDF code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('faste-devis.html')
          s=p.read_text(encoding='utf-8')
          # The real generator saves using safe+'.pdf', not filename.
          marker="pdf.save(safe+'.pdf')"
          capture="if(window.__fasteCapturePdf){window.__fastePdfBlob=pdf.output('blob');return;}pdf.save(safe+'.pdf')"
          if capture not in s:
              if marker not in s: raise SystemExit('ligne pdf.save(safe+.pdf) introuvable')
              s=s.replace(marker,capture,1)
          # Replace every duplicate declaration of downloadCurrentPdf with one clean implementation.
          positions=[]; pos=0
          needle='function downloadCurrentPdf('
          while True:
              i=s.find(needle,pos)
              if i<0: break
              # include optional async immediately before function
              start=i-6 if s[max(0,i-6):i]=='async ' else i
              positions.append(start); pos=i+1
          if not positions: raise SystemExit('downloadCurrentPdf introuvable')
          fn="""async function downloadCurrentPdf(){
            try{
              const d=currentFormDoc();
              const filename=(d.number||'FASTE-document')+'.pdf';
              const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
              if(!isIOS){generatePdf(d);return;}
              if(!window.jspdf?.jsPDF){alert('Le module PDF n’est pas chargé. Vérifie ta connexion internet puis recharge la page.');return;}
              window.__fasteCapturePdf=true;
              window.__fastePdfBlob=null;
              try{generatePdf(d);}finally{window.__fasteCapturePdf=false;}
              const blob=window.__fastePdfBlob;
              window.__fastePdfBlob=null;
              if(!blob)throw new Error('PDF non généré');
              const file=new File([blob],filename,{type:'application/pdf'});
              if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return;}
              const url=URL.createObjectURL(blob);
              const win=window.open(url,'_blank');
              if(!win)window.location.href=url;
              setTimeout(()=>URL.revokeObjectURL(url),60000);
            }catch(e){console.error(e);alert('Impossible de générer le PDF : '+(e?.message||e));}
          }"""
          # Replace from last declaration backwards; after each replacement there is only one declaration left.
          for start in reversed(positions):
              depth=0;began=False;end=None
              for i in range(start,len(s)):
                  c=s[i]
                  if c=='{': depth+=1;began=True
                  elif c=='}' and began:
                      depth-=1
                      if depth==0: end=i+1;break
              if end is None: raise SystemExit('fin fonction introuvable')
              s=s[:start]+fn+s[end:]
          # Ensure only one declaration remains and all critical pieces are present.
          assert s.count('function downloadCurrentPdf(')==1
          assert "window.__fastePdfBlob=pdf.output('blob')" in s
          assert "pdf.save(safe+'.pdf')" in s
          p.write_text(s,encoding='utf-8')
          print('REAL PDF PATCH VERIFIED')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faste-devis.html
          git commit -m "Corrige le vrai générateur PDF iPhone"
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-pdf-real.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/fix-pdf-real.yml
          git diff --cached --quiet || git commit -m "Supprime le workflow temporaire PDF"
          git push || true
