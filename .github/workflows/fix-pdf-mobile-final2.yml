name: Fix PDF mobile final 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply robust PDF fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('faste-devis.html')
          s=p.read_text(encoding='utf-8')
          # Ensure generatePdf exposes the generated document without changing desktop behavior.
          if 'pdf.save(filename);return pdf;' not in s:
              s=s.replace('pdf.save(filename);','pdf.save(filename);return pdf;',1)
          start=s.find('async function generatePdfForMobile(')
          if start < 0:
              raise SystemExit('generatePdfForMobile introuvable')
          # Find the closing brace by counting braces, so minified/newline formatting does not matter.
          depth=0; end=None; began=False
          for i in range(start,len(s)):
              c=s[i]
              if c=='{': depth+=1; began=True
              elif c=='}' and began:
                  depth-=1
                  if depth==0:
                      end=i+1; break
          if end is None: raise SystemExit('fin de generatePdfForMobile introuvable')
          new="""async function generatePdfForMobile(d,filename,isIOS,win){
            if(!window.jspdf?.jsPDF){alert('Le module PDF n’est pas chargé. Vérifie ta connexion internet puis recharge la page.');return;}
            try{
              const pdf=generatePdf(d);
              if(!pdf)throw new Error('PDF non généré');
              const blob=pdf.output('blob');
              if(!blob)throw new Error('PDF non généré');
              const file=new File([blob],filename,{type:'application/pdf'});
              if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return;}
              const url=URL.createObjectURL(blob);
              if(isIOS){if(win && !win.closed)win.location.href=url;else window.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),60000);}
              else{const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
            }catch(e){console.error(e);throw e;}
          }"""
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          # Hard verification before commit.
          assert 'pdf.save(filename);return pdf;' in s
          assert "const blob=pdf.output('blob');" in s
          assert 'async function generatePdfForMobile' in s
          print('PATCH VERIFIED')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faste-devis.html
          git commit -m "Corrige la génération PDF sur iPhone"
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-pdf-mobile-final2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/fix-pdf-mobile-final2.yml
          git diff --cached --quiet || git commit -m "Supprime le workflow temporaire PDF"
          git push || true
