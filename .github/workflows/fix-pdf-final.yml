name: Patch final PDF
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('faste-devis.html'); s=p.read_text(encoding='utf-8')
          marker="pdf.save(safe+'.pdf')"
          capture="if(window.__fasteCapturePdf){window.__fastePdfBlob=pdf.output('blob');return;}pdf.save(safe+'.pdf')"
          if capture not in s:
              if marker not in s: raise SystemExit('save introuvable')
              s=s.replace(marker,capture,1)
          needle='function downloadCurrentPdf('
          pos=s.rfind(needle)
          if pos<0: raise SystemExit('downloadCurrentPdf introuvable')
          start=pos-6 if s[max(0,pos-6):pos]=='async ' else pos
          depth=0; began=False; end=None
          for i in range(start,len(s)):
              c=s[i]
              if c=='{': depth+=1; began=True
              elif c=='}' and began:
                  depth-=1
                  if depth==0: end=i+1; break
          if end is None: raise SystemExit('fin introuvable')
          fn="""async function downloadCurrentPdf(){
            try{
              const d=currentFormDoc();
              const filename=(d.number||'FASTE-document')+'.pdf';
              const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
              if(!isIOS){generatePdf(d);return;}
              if(!window.jspdf?.jsPDF){alert('Le module PDF n’est pas chargé. Recharge FASTE puis réessaie.');return;}
              window.__fasteCapturePdf=true;window.__fastePdfBlob=null;
              try{generatePdf(d);}finally{window.__fasteCapturePdf=false;}
              const blob=window.__fastePdfBlob;window.__fastePdfBlob=null;
              if(!blob)throw new Error('PDF non généré');
              const file=new File([blob],filename,{type:'application/pdf'});
              if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return;}
              const url=URL.createObjectURL(blob);const w=window.open(url,'_blank');if(!w)window.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),60000);
            }catch(e){console.error(e);alert('Impossible de générer le PDF : '+(e?.message||e));}
          }"""
          s=s[:start]+fn+s[end:]
          assert capture in s
          assert 'async function downloadCurrentPdf' in s
          assert "window.__fastePdfBlob=pdf.output('blob')" in s
          p.write_text(s,encoding='utf-8')
          print('OK PATCH')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faste-devis.html
          git commit -m "Corrige définitivement le bouton PDF iPhone"
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-pdf-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/fix-pdf-final.yml
          git diff --cached --quiet || git commit -m "Supprime workflow PDF temporaire"
          git push || true
