name: Apply FASTE settings

on:
  push:
    paths:
      - '.settings-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files safely
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'faste-parametres.html' not in s:
              s,n=re.subn(r'(<nav\s+class=["\']nav["\']\s*>)',r'\1\n        <button class="nav-btn" type="button" onclick="window.location.href=\'faste-parametres.html\'">⚙️ Paramètres</button>',s,count=1)
              if n!=1: raise SystemExit(f'index nav not found: {n}')
              p.write_text(s,encoding='utf-8')

          p=Path('faste-devis.html')
          s=p.read_text(encoding='utf-8')
          if 'faste-parametres.html' not in s:
              old='<div class="actions"><button class="btn secondary" onclick="window.close()">← Fermer</button><button class="btn green" onclick="openDoc()">+ Nouveau devis</button></div>'
              new='<div class="actions"><button class="btn secondary" onclick="window.location.href=\'index.html\'">← FASTE</button><button class="btn secondary" onclick="window.location.href=\'faste-parametres.html\'">⚙️ Paramètres</button><button class="btn green" onclick="openDoc()">+ Nouveau devis</button></div>'
              if s.count(old)!=1: raise SystemExit(f'devis top actions not found: {s.count(old)}')
              s=s.replace(old,new,1)

          if 'let companySettings=' not in s:
              old='let docs=[];let prospects=[];let currentId=null;let cloudData={};'
              new='let docs=[];let prospects=[];let currentId=null;let cloudData={};let companySettings={};'
              if s.count(old)!=1: raise SystemExit(f'devis state not found: {s.count(old)}')
              s=s.replace(old,new,1)

          if 'companySettings=cloudData.settings||{};' not in s:
              old='cloudData=a?.[0]?.data||{};docs=Array.isArray(cloudData.devis_factures)?cloudData.devis_factures:[];prospects=mergeProspects(cloudData.prospects);'
              new='cloudData=a?.[0]?.data||{};companySettings=cloudData.settings||{};docs=Array.isArray(cloudData.devis_factures)?cloudData.devis_factures:[];prospects=mergeProspects(cloudData.prospects);'
              if s.count(old)!=1: raise SystemExit(f'devis loadCloud not found: {s.count(old)}')
              s=s.replace(old,new,1)

          if "const cs={companyName:'FASTE'" not in s:
              old="pdfT('ÉMETTEUR',left+7,y+8,7.5,'bold',muted);pdfT('FASTE',left+7,y+17,11,'bold',text);wrapped('Informations légales à compléter',left+7,y+24,73,8,4.2,'normal',text);wrapped('SIRET  •  TVA  •  Adresse  •  Téléphone  •  Email',left+7,y+32,73,6.8,'normal',muted);"
              new="const cs={companyName:'FASTE',legalForm:'',siren:'',siret:'',vat:'',capital:'',address:'',zip:'',city:'',phone:'',email:'',website:'',iban:'',bic:'',...companySettings};pdfT('ÉMETTEUR',left+7,y+8,7.5,'bold',muted);pdfT(cs.companyName||'FASTE',left+7,y+17,11,'bold',text);let issuer=[];if(cs.legalForm)issuer.push(cs.legalForm);if(cs.siret)issuer.push('SIRET '+cs.siret);if(cs.siren)issuer.push('SIREN '+cs.siren);if(cs.vat)issuer.push('TVA '+cs.vat);if(cs.capital)issuer.push('Capital '+cs.capital+' €');if(cs.address)issuer.push(cs.address+(cs.zip||cs.city?' — '+[cs.zip,cs.city].filter(Boolean).join(' '):''));if(cs.phone)issuer.push(cs.phone);if(cs.email)issuer.push(cs.email);wrapped(issuer.join('  •  ')||'Informations légales à compléter',left+7,y+24,73,6.8,3.7,'normal',issuer.length?text:muted);"
              if s.count(old)!=1: raise SystemExit(f'PDF issuer block not found: {s.count(old)}')
              s=s.replace(old,new,1)

          if "cs.iban?'IBAN : '+cs.iban" not in s:
              old="pdfT('Les informations légales de FASTE pourront être ajoutées ultérieurement dans les paramètres de l’entreprise.',left,y,7.2,'normal',muted);pdfT('Document généré automatiquement par FASTE.',left,y+4.5,7.2,'normal',muted);"
              new="pdfT((cs.companyName||'FASTE')+'  •  Document commercial',left,y,7.2,'normal',muted);pdfT(cs.iban?'IBAN : '+cs.iban+(cs.bic?'  •  BIC : '+cs.bic:''):'Coordonnées de paiement disponibles dans les paramètres.',left,y+4.5,7.2,'normal',muted);"
              if s.count(old)!=1: raise SystemExit(f'PDF footer block not found: {s.count(old)}')
              s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          print('Safe settings integration completed.')
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html faste-devis.html
          git diff --cached --quiet || (git commit -m 'Integrate shared company settings' && git push)
