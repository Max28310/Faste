<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FASTE — Connexion</title><style>body{margin:0;background:#07111f;color:#edf4ff;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 40px));background:#0d1b2d;border:1px solid #213650;border-radius:18px;padding:30px;box-sizing:border-box}.brand{font-size:28px;font-weight:900}.sub{color:#8fa4bd;margin:8px 0 25px;font-size:13px}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-size:12px;color:#8fa4bd;font-weight:700}.field input{background:#081525;border:1px solid #213650;color:#edf4ff;border-radius:9px;padding:12px;outline:none}.btn{width:100%;padding:12px;border-radius:9px;border:0;background:#d7b46a;color:#111;font-weight:800;cursor:pointer}.msg{min-height:18px;margin-top:14px;font-size:12px;color:#ffb4b4}.ok{color:#b9e7c0}</style></head><body><main class="box"><div class="brand">FASTE</div><div class="sub">Espace privé — accès réservé aux associés</div><form id="form"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="submitBtn" type="submit">Se connecter</button></form><div class="msg" id="msg"></div></main><script>const U='https://jmaswyffmeaaauymapmi.supabase.co',K='sb_publishable_pERmayuxuRzMADUxvJDI2w_vwDCMS9c',next=new URLSearchParams(location.search).get('next')||'faste-app.html',msg=document.getElementById('msg');navigator.serviceWorker?.register('faste-sw.js',{scope:'/Faste/'}).catch(console.error);function db(){return new Promise((r,j)=>{const q=indexedDB.open('faste-auth',1);q.onupgradeneeded=()=>q.result.createObjectStore('session');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}async function put(k,v){const d=await db();d.transaction('session','readwrite').objectStore('session').put(v,k)}async function saveSession(access,refresh,expires){await put('token',access);await put('refresh',refresh||'');await put('expires_at',Date.now()+((expires||3600)*1000));localStorage.setItem('faste_logged','1');navigator.serviceWorker.ready.then(x=>x.active?.postMessage({type:'SESSION',session:{access_token:access,refresh_token:refresh||'',expires_in:expires||3600}}))}document.getElementById('form').onsubmit=async e=>{e.preventDefault();msg.className='msg';msg.textContent='Connexion…';document.getElementById('submitBtn').disabled=true;try{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.message||d.error_description||d.msg||d.error||'Connexion refusée');await saveSession(d.access_token,d.refresh_token||'',d.expires_in||3600);msg.className='msg ok';msg.textContent='Connexion réussie.';location.replace(next)}catch(x){msg.textContent=x.message||'Connexion impossible.';document.getElementById('submitBtn').disabled=false}};</script></body></html>
