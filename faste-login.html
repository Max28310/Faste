<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FASTE — Connexion</title>
  <style>
    :root{--bg:#07111f;--panel:#0d1b2d;--line:#213650;--text:#edf4ff;--muted:#8fa4bd;--gold:#d7b46a;--danger:#ffb4b4}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#102743 0,var(--bg) 48%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:rgba(13,27,45,.96);border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 28px 80px rgba(0,0,0,.35)}.mark{width:44px;height:44px;border:1px solid var(--gold);color:var(--gold);border-radius:12px;display:grid;place-items:center;font-family:Georgia,serif;font-size:25px;margin-bottom:18px}.brand{font-size:29px;font-weight:900;letter-spacing:.04em}.sub{color:var(--muted);margin:8px 0 26px;font-size:13px}.field{display:flex;flex-direction:column;gap:7px;margin:15px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input{background:#081525;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:13px;outline:none;font:inherit}.field input:focus{border-color:var(--gold)}.btn{width:100%;padding:13px;border-radius:10px;border:0;background:var(--gold);color:#111;font-weight:850;cursor:pointer;margin-top:8px}.btn:disabled{opacity:.55;cursor:wait}.msg{min-height:19px;margin-top:14px;font-size:12px;color:var(--danger)}.ok{color:#b9e7c0}
  </style>
</head>
<body><main class="box"><div class="mark">F</div><div class="brand">FASTE</div><div class="sub">Espace privé — accès réservé aux associés</div><form id="loginForm"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="submitBtn" type="submit">Se connecter</button></form><div class="msg" id="msg" role="status"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="faste-auth.js?v=20260910-3"></script>
<script>
const form=document.getElementById('loginForm'),msg=document.getElementById('msg'),button=document.getElementById('submitBtn');
const next=new URLSearchParams(location.search).get('next')||'faste-app.html?v=20260910-3';
(async()=>{try{if(await fasteAuth.session())location.replace(next)}catch(e){console.error(e)}})();
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';msg.textContent='Connexion…';button.disabled=true;try{const {error}=await fasteAuth.client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;msg.className='msg ok';msg.textContent='Connexion réussie.';location.replace(next)}catch(error){msg.textContent=error?.message==='Invalid login credentials'?'Identifiants incorrects.':(error?.message||'Connexion impossible.');button.disabled=false}});
</script></body></html>
