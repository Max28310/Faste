<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FASTE — Connexion</title><style>body{margin:0;background:#07111f;color:#edf4ff;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 40px));background:#0d1b2d;border:1px solid #213650;border-radius:18px;padding:30px;box-sizing:border-box}.brand{font-size:28px;font-weight:900}.sub{color:#8fa4bd;margin:8px 0 25px;font-size:13px}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-size:12px;color:#8fa4bd;font-weight:700}.field input{background:#081525;border:1px solid #213650;color:#edf4ff;border-radius:9px;padding:12px;outline:none}.field input:focus{border-color:#d7b46a}.btn{width:100%;padding:12px;border-radius:9px;border:0;background:#d7b46a;color:#111;font-weight:800;cursor:pointer;margin-top:8px}.link{display:block;text-align:center;margin-top:15px;color:#d7b46a;font-size:12px;cursor:pointer}.msg{min-height:18px;margin-top:14px;font-size:12px;color:#ffb4b4}</style></head><body><main class="box"><div class="brand">FASTE</div><div class="sub">Espace privé — accès réservé aux associés</div><form id="form"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Se connecter</button></form><span class="link" id="reset">Mot de passe oublié ?</span><div class="msg" id="msg"></div></main><script>const URL='https://jmaswyffmeaaauymapmi.supabase.co',KEY='sb_publishable_pERmayuxuRzMADUxvJDI2w_vwDCMS9c';const msg=document.getElementById('msg');const next=new URLSearchParams(location.search).get('next')||'index.html';function headers(){return {apikey:KEY,'Content-Type':'application/json'}}document.getElementById('form').onsubmit=async e=>{e.preventDefault();msg.textContent='Connexion…';try{const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:headers(),body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'Identifiants incorrects');sessionStorage.setItem('faste_access_token',d.access_token);sessionStorage.setItem('faste_user_email',email.value.trim().toLowerCase());location.replace(next)}catch(e){msg.textContent=e.message}};document.getElementById('reset').onclick=async()=>{const e=email.value.trim();if(!e){msg.textContent='Saisis ton e-mail puis clique à nouveau.';return}msg.textContent='Envoi du lien…';try{const r=await fetch(URL+'/auth/v1/recover',{method:'POST',headers:headers(),body:JSON.stringify({email:e})});if(!r.ok)throw new Error('Impossible d’envoyer le lien.');msg.textContent='Si ce compte existe, un lien de réinitialisation a été envoyé.'}catch(x){msg.textContent=x.message}};</script></body></html>
