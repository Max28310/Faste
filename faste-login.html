<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FASTE — Connexion</title><style>body{margin:0;background:#07111f;color:#edf4ff;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 40px));background:#0d1b2d;border:1px solid #213650;border-radius:18px;padding:30px;box-sizing:border-box}.brand{font-size:28px;font-weight:900}.sub{color:#8fa4bd;margin:8px 0 25px;font-size:13px}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-size:12px;color:#8fa4bd;font-weight:700}.field input{background:#081525;border:1px solid #213650;color:#edf4ff;border-radius:9px;padding:12px;outline:none}.btn{width:100%;padding:12px;border-radius:9px;border:0;background:#d7b46a;color:#111;font-weight:800;cursor:pointer}.link{display:block;text-align:center;margin-top:15px;color:#d7b46a;font-size:12px;cursor:pointer}.msg{min-height:18px;margin-top:14px;font-size:12px;color:#ffb4b4}</style></head><body><main class="box"><div class="brand">FASTE</div><div class="sub">Espace privé — accès réservé aux associés</div><form id="form"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Se connecter</button></form><span class="link" id="reset">Mot de passe oublié ?</span><div class="msg" id="msg"></div></main><script>const U='https://jmaswyffmeaaauymapmi.supabase.co',K='sb_publishable_pERmayuxuRzMADUxvJDI2w_vwDCMS9c',next=new URLSearchParams(location.search).get('next')||'faste-app.html',msg=document.getElementById('msg');navigator.serviceWorker?.register('faste-sw.js',{scope:'/Faste/'}).catch(console.error);function db(){return new Promise((r,j)=>{const q=indexedDB.open('faste-auth',1);q.onupgradeneeded=()=>q.result.createObjectStore('session');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}async function saveToken(t){const d=await db();d.transaction('session','readwrite').objectStore('session').put(t,'token');localStorage.setItem('faste_logged','1')}document.getElementById('form').onsubmit=async e=>{e.preventDefault();msg.textContent='Connexion…';try{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'Identifiants incorrects');await saveToken(d.access_token);navigator.serviceWorker.ready.then(x=>x.active?.postMessage({type:'TOKEN',token:d.access_token}));location.replace(next)}catch(x){msg.textContent=x.message}};document.getElementById('reset').onclick=async()=>{const e=email.value.trim();if(!e){msg.textContent='Saisis ton e-mail puis clique à nouveau.';return}await fetch(U+'/auth/v1/recover',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:e})});msg.textContent='Si ce compte existe, un lien de réinitialisation a été envoyé.'}</script></body></html>
