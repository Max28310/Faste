<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FASTE — Connexion</title><style>body{margin:0;background:#07111f;color:#edf4ff;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 40px));background:#0d1b2d;border:1px solid #213650;border-radius:18px;padding:30px;box-sizing:border-box}.brand{font-size:28px;font-weight:900}.sub{color:#8fa4bd;margin:8px 0 25px;font-size:13px}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-size:12px;color:#8fa4bd;font-weight:700}.field input{background:#081525;border:1px solid #213650;color:#edf4ff;border-radius:9px;padding:12px;outline:none}.btn{width:100%;padding:12px;border-radius:9px;border:0;background:#d7b46a;color:#111;font-weight:800;cursor:pointer}.link{display:block;text-align:center;margin-top:15px;color:#d7b46a;font-size:12px;cursor:pointer}.msg{min-height:18px;margin-top:14px;font-size:12px;color:#ffb4b4}.ok{color:#b9e7c0}</style></head><body><main class="box"><div class="brand">FASTE</div><div class="sub" id="sub">Espace privé — accès réservé aux associés</div><form id="form"><div class="field" id="emailField"><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label id="passwordLabel">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required></div><div class="field" id="confirmField" style="display:none"><label>Confirmer le nouveau mot de passe</label><input id="confirm" type="password" autocomplete="new-password"></div><button class="btn" id="submitBtn" type="submit">Se connecter</button></form><span class="link" id="reset">Première connexion / mot de passe oublié</span><div class="msg" id="msg"></div></main><script>const U='https://jmaswyffmeaaauymapmi.supabase.co',K='sb_publishable_pERmayuxuRzMADUxvJDI2w_vwDCMS9cK',next=new URLSearch isplay='none';document.getElementById('password').focus()}if(magicToken){saveSession(magicToken,magicRefresh,magicExpires).then(()=>location.replace(next)).catch(()=>{msg.textContent='Impossible d’ouvrir la session FASTE.'})}else if(recovery&&recoveryToken){setRecoveryMode()}if(recoveryError){msg.textContent=recoveryError.replace(/\+/g,' ')}document.getElementById('form').onsubmit=async e=>{e.preventDefault();msg.className='msg';msg.textContent='Traitement…';try{if(recovery&&recoveryToken){const p=document.getElementById('password').value;if(p.length<6)throw new Error('Le mot de passe doit contenir au moins 6 caractères.');if(p!==document.getElementById('confirm').value)throw new Error('Les deux mots de passe ne correspondent pas.');const r=await fetch(U+'/auth/v1/user',{method:'PUT',headers:{apikey:K,Authorization:'Bearer '+recoveryToken,'Content-Type':'application/json'},body:JSON.stringify({password:p})});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.error_description||'Impossible de modifier le mot de passe.');await clearSession();msg.className='msg ok';msg.textContent='Mot de passe modifié. Tu peux maintenant te connecter.';setTimeout(()=>location.replace('faste-login.html'),900);return}msg.textContent='Connexion…';const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'Identifiants incorrects');await saveSession(d.access_token,d.refresh_token||'',d.expires_in||3600);location.replace(next)}catch(x){msg.textContent=x.message}};document.getElementById('reset').onclick=async()=>{const e=document.getElementById('email').value.trim();if(!e){msg.textContent='Saisis ton e-mail puis clique à nouveau.';return}const redirectTo='https://max28310.github.io/Faste/faste-login.html';const r=awa
